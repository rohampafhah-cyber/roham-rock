<style>
:root{
  --bg:#03050c;--bg2:#070b18;
  --card:rgba(18,26,46,.72);--card2:rgba(10,15,28,.92);
  --tx:#e8ecf8;--mu:#8a97b8;
  --ac:#f5a524;--ac2:#00E5FF;--vi:#8B5CF6;
  --bd:rgba(37,49,79,.8);
  --glow:0 0 24px rgba(245,165,36,.35);
  --glow2:0 0 32px rgba(0,229,255,.25);
}
:root[data-theme=light]{
  --bg:#eef1f8;--bg2:#dde3f0;
  --card:rgba(255,255,255,.88);--card2:rgba(255,255,255,.97);
  --tx:#0f1424;--mu:#566080;
  --ac:#d9480f;--ac2:#0077b6;--vi:#6d28d9;
  --bd:#c9d2e6;
  --glow:0 0 20px rgba(217,72,15,.25);
  --glow2:0 0 24px rgba(0,119,182,.2);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Vazirmatn,Tahoma,sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,rgba(139,92,246,.18),transparent 60%),
             radial-gradient(900px 700px at -10% 100%,rgba(0,229,255,.14),transparent 60%),
             var(--bg);
  color:var(--tx);transition:background .4s,color .3s;
  overflow-x:hidden;min-height:100vh;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
:root[data-theme=light] #bg{opacity:.75}
main,header,footer{position:relative;z-index:2}

/* Header */
header{
  position:sticky;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 18px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent),color-mix(in srgb,var(--bg) 65%,transparent));
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--bd);z-index:10;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:38px;height:38px;border-radius:12px;
  background:conic-gradient(from 210deg,var(--ac),var(--vi),var(--ac2),var(--ac));
  display:grid;place-items:center;font-size:1.1rem;
  box-shadow:0 0 20px rgba(0,229,255,.35),inset 0 0 12px rgba(0,0,0,.4);
  animation:spinLogo 12s linear infinite;
}
@keyframes spinLogo{to{transform:rotate(360deg)}}
.brand h1{font-size:1.05rem;font-weight:900;
  background:linear-gradient(90deg,var(--ac),var(--ac2));
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em;}
.brand small{display:block;font-size:.68rem;color:var(--mu);font-weight:400;margin-top:2px;letter-spacing:.15em;font-family:'Orbitron',sans-serif}
header .spacer{flex:1}
input,select,button{
  font:inherit;color:var(--tx);background:var(--card);
  border:1px solid var(--bd);border-radius:12px;padding:9px 14px;
  transition:.2s;outline:none;
}
input:focus,select:focus{border-color:var(--ac2);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
#q{flex:0 1 260px;min-width:140px}
button{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0b0f18;border-color:transparent;box-shadow:var(--glow)}

/* Hero */
#hero{height:64vh;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;
  padding:22px 18px;cursor:grab;touch-action:none;position:relative;overflow:hidden;}
#hero:active{cursor:grabbing}
#hero::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:60%;height:120px;background:radial-gradient(ellipse at center,rgba(0,229,255,.18),transparent 70%);pointer-events:none;}
#hero h2{font-size:clamp(1.8rem,5.5vw,3.4rem);font-weight:900;
  text-shadow:0 4px 30px rgba(0,229,255,.35),0 2px 8px #000c;pointer-events:none;letter-spacing:-.01em;
  background:linear-gradient(90deg,#fff,var(--ac) 40%,var(--ac2) 70%,#fff);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;}
@keyframes shine{to{background-position:200% center}}
#hero p{color:var(--mu);pointer-events:none;margin-top:8px;font-size:.95rem}
.hero-tip{margin-top:14px;display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;font-size:.78rem;
  background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--mu);pointer-events:none;backdrop-filter:blur(8px);}

/* Chips */
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:16px}
.chip{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:.88rem;transition:.25s;}
.chip:hover{transform:translateY(-2px)}

/* Grid */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:10px 18px 60px;max-width:1320px;margin:auto;}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;
  opacity:0;animation:in .55s forwards;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .25s;
  backdrop-filter:blur(12px) saturate(140%);position:relative;}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,transparent,rgba(0,229,255,.4),transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:.4s;pointer-events:none;z-index:3;}
.card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 20px 40px #0009,var(--glow2);border-color:transparent}
.card:hover::before{opacity:1}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.ph{height:160px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 30% 30%,rgba(0,229,255,.25),transparent 55%),
             radial-gradient(circle at 70% 70%,rgba(139,92,246,.25),transparent 55%),
             linear-gradient(135deg,#2a3558,#10162a);
  display:flex;align-items:center;justify-content:center;font-size:3rem;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s;position:relative;z-index:1}
.card:hover .ph img{transform:scale(1.08)}
.ph .emoji{filter:drop-shadow(0 4px 12px #000a);z-index:1;position:relative}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.55));pointer-events:none;z-index:2;}
.ph.has-img::after{opacity:.6}
.cb{padding:14px}
.cb h3{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.cb small{color:var(--mu);direction:ltr;display:block;font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:.06em}
.tag{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;font-size:.75rem;
  background:linear-gradient(135deg,var(--ac),var(--vi));color:#0b0f18;font-weight:700;}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:14px;}
#modal.on{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.box{background:var(--card2);border:1px solid var(--ac);border-radius:22px;max-width:820px;width:100%;max-height:92vh;overflow:auto;

@keyframes zoomIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}

.box .ph img{object-fit:cover}

.det div{padding:10px 0;border-bottom:1px dashed var(--bd);font-size:.95rem;line-height:1.9}
.det div:last-child{border-bottom:0}
.det b{color:var(--ac);font-weight:700}
#x{position:absolute;top:12px;left:12px;z-index:5;width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1px solid var(--bd);color:#fff;font-size:1.1rem;display:grid;place-items:center;padding:0;}
#x:hover{background:var(--ac);color:#0b0f18;transform:rotate(90deg)}

/* Empty */
#empty{text-align:center;color:var(--mu);padding:60px 20px;display:none;font-size:1.1rem}

footer{text-align:center;padding:34px 18px 40px;border-top:1px solid var(--bd);color:var(--mu);font-size:.85rem;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 92%,transparent));}
footer .sig{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.25em;
  background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;
  font-size:1rem;margin-bottom:8px;}
footer .role{font-size:.72rem;letter-spacing:.2em;color:var(--mu);margin-top:4px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--ac),var(--vi));border-radius:99px;border:2px solid var(--bg)}

@media(max-width:700px){
  header{padding:10px 12px;gap:8px}
  .brand h1{font-size:.92rem}
  .brand small{display:none}
  #q{flex:1 1 100%;order:3}
  #grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:8px 12px 40px}
  .ph{height:130px;font-size:2.4rem}
  .box .ph{height:240px}
  .det h2{font-size:1.2rem}
  #hero{height:52vh;min-height:300px}
}
</style>

/* ساخت لیست URL به ترتیب اولویت */
function getImageCandidates(faName){
  const list = [];
  // اولویت ۱: URL مستقیم خودت
  if(IMG_URL[faName]) list.push(IMG_URL[faName]);
  // اولویت ۲: Wikimedia Special:FilePath
  if(IMG_FILE[faName]){
    list.push('https://commons.wikimedia.org/wiki/Special:FilePath/' + IMG_FILE[faName] + '?width=800');
  }
  return list;
}

/* ===== بارگذاری عکس با امتحان کردن همه URLها به ترتیب ===== */
const imgCache = {};

function loadImg(d, el){
  // اگه قبلاً موفق شده بود
  if(imgCache[d.fa] && imgCache[d.fa] !== 'fail'){
    el.innerHTML = '';
    el.appendChild(imgCache[d.fa].cloneNode(true));
    el.classList.add('has-img');
    return;
  }
  // اگه قبلاً کاملاً fail شده بود، ایموجی بمونه
  if(imgCache[d.fa] === 'fail') return;

  const urls = getImageCandidates(d.fa);
  if(urls.length === 0) return; // ایموجی بمونه

  let idx = 0;

  function tryNext(){
    if(idx >= urls.length){
      // همه URLها fail شدن → ایموجی می‌مونه
      imgCache[d.fa] = 'fail';
      console.warn('❌ همه عکس‌ها fail شدن:', d.fa, urls);
      return;
    }
    const url = urls[idx++];
    const im = new Image();
    im.alt = d.fa;
    im.loading = 'lazy';
    im.referrerPolicy = 'no-referrer';
    // ⚠️ crossOrigin رو ست نمی‌کنیم تا uploadkon.ir بلاک نکنه
    im.onload = () => {
      imgCache[d.fa] = im;
      if(el.isConnected){
        el.innerHTML = '';
        el.appendChild(im);
        el.classList.add('has-img');
      }
    };
    im.onerror = () => {
      console.warn('⚠️ عکس لود نشد، امتحان بعدی:', url);
      tryNext();
    };
    im.src = url;
  }
  tryNext();
}

function makeGlow(color,size){
  const c=document.createElement('canvas');c.width=c.height=256;
  const ctx=c.getContext('2d');
  const grd=ctx.createRadialGradient(128,128,0,128,128,128);
  grd.addColorStop(0,'rgba(255,220,150,1)');
  grd.addColorStop(0.25,color+'cc');
  grd.addColorStop(0.6,color+'22');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,256,256);
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false});
  const spr=new THREE.Sprite(mat);
  spr.scale.set(size,size,1);
  return spr;
}

}

/* کنترل دوربین */
let dragging=false,lx=0,ly=0;
let camYaw=0,camPitch=0.22,camDist=42;
let targetYaw=0,targetPitch=0.22,targetDist=42;

const hero=$('#hero');
hero.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;hero.style.cursor='grabbing';});
addEventListener('pointerup',()=>{dragging=false;hero.style.cursor='grab'});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  targetYaw+=(e.clientX-lx)*0.005;
  targetPitch=Math.max(-0.6,Math.min(1.2,targetPitch-(e.clientY-ly)*0.004));
  lx=e.clientX;ly=e.clientY;
});
addEventListener('wheel',e=>{targetDist=Math.max(14,Math.min(90,targetDist+e.deltaY*0.04));},{passive:true});

function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
addEventListener('resize',resize);
resize();

let t0=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-t0)/1000);t0=now;

  camYaw+=(targetYaw-camYaw)*0.08;
  camPitch+=(targetPitch-camPitch)*0.08;
  camDist+=(targetDist-camDist)*0.08;

  C.position.set(
    Math.sin(camYaw)*Math.cos(camPitch)*camDist,
    Math.sin(camPitch)*camDist+4,
    Math.cos(camYaw)*Math.cos(camPitch)*camDist
  );
  C.lookAt(0,0,0);

  stars.rotation.y+=dt*0.008;
  sun.scale.setScalar(1+Math.sin(now*0.001)*0.02);

  planets.forEach(p=>{
    p.angle+=dt*p.speed*0.25;
    p.pivot.rotation.y=p.angle;
    p.mesh.rotation.y+=dt*0.6;
  });

  comets.forEach(c=>{
    const u=c.userData;
    u.angle+=dt*u.speed*0.3;
    c.position.set(Math.cos(u.angle)*u.radius,u.y+Math.sin(u.angle*0.7)*3,Math.sin(u.angle)*u.radius);
    c.lookAt(0,0,0);c.rotateY(Math.PI);
  });

  R.render(S,C);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
